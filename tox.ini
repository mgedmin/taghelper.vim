[tox]
envlist = ruff,py310,py311,py312,py313,py314,coverage
skipsdist = true

[testenv]
deps =
    pytest
commands =
    pytest {posargs}

[testenv:coverage]
basepython = python3
deps =
    pytest
    coverage
commands =
    coverage run -m pytest {posargs}
    coverage report -m --fail-under=100


[testenv:ruff]
deps = ruff
skip_install = true
commands = ruff check pythonx/ tests/
